version: '3'

dotenv: ['.env']

vars:
  DB_DRIVER: postgres
  METRICS_CONTAINER: "sanctum-metrics-1"
  DB_CONNECTION_STRING: "postgres://dev:password@localhost:5430/metrics?sslmode=disable"
  MIGRATIONS_DIR: "./internal/db/migrations"
  SQLC_CONFIG: "./internal/db/sqlc.yml"

tasks:
  migrate:create:
    desc: Create a new migration file
    interactive: true
    silent: true
    cmds:
      - |
        echo -n "Enter migration name: "
        read name
        goose -dir {{.MIGRATIONS_DIR}} create "$name" sql

  migrate:up:
    desc: Apply all available migrations
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} {{.DB_DRIVER}} "{{.DB_CONNECTION_STRING}}" up

  migrate:down:
    desc: Rollback the last applied migration
    cmds:
      - goose -dir {{.MIGRATIONS_DIR}} {{.DB_DRIVER}} "{{.DB_CONNECTION_STRING}}" down

  rebuild:
     desc: Rebuilds the GO project and restarts the debugger
     cmds:
       - docker exec {{.METRICS_CONTAINER}} bash -c 'cd scripts && ./build-and-debug.sh'

  sqlc:generate:
    desc: Generate Go code from SQL
    cmds:
      - sqlc generate -f {{.SQLC_CONFIG}}

  seed:init:
    desc: Seed admin user
    env:
      AUTH_DATABASE_URL: '{{.DB_CONNECTION_STRING}}'
    cmds:
      - go run cmd/seed/main.go

  swagger:generate:
    desc: Generate swagger docs
    dir: .
    cmds:
      - >
        swag init
        -g ./cmd/api/main.go
        -o ./docs
        --parseInternal
        --parseDependency

  generate:rsa:key-pair:
    desc: Generate an RSA private + public key pair
    dir: .
    vars:
      # Allow passing a name (defaults to current date)
      NAME: '{{default (now | date "2006-01-02") .NAME}}'
    cmds:
      - |
        mkdir -p secrets
        echo "Generating RSA key pair: jwt_rsa_private_{{.NAME}}.pem / jwt_rsa_public_{{.NAME}}.pem"
        openssl genrsa -out "secrets/jwt_rsa_private_{{.NAME}}.pem" 2048
        openssl rsa -in "secrets/jwt_rsa_private_{{.NAME}}.pem" -pubout -out "secrets/jwt_rsa_public_{{.NAME}}.pem"
        chmod 600 secrets/jwt_rsa_private_{{.NAME}}.pem
        echo "Done. KID = {{.NAME}}"

  update:env:jwt-keys:
    desc: Generate a new RSA key pair and update .env with paths and KID
    deps: [ generate:rsa:key-pair ]
    vars:
      # Allow passing a name (defaults to current date)
      NAME: '{{default (now | date "2006-01-02") .NAME}}'
      silent: true
    cmds:
      - |
        echo "Updating .env with key paths for {{.NAME}}"

        # Replace or add JWT_RSA_PRIV_PATH
        if grep -q "^JWT_RSA_PRIV_PATH=" .env; then
          sed -i '' "s|^JWT_RSA_PRIV_PATH=.*|JWT_RSA_PRIV_PATH=./secrets/jwt_rsa_private_{{.NAME}}.pem|" .env
        else
          echo "JWT_RSA_PRIV_PATH=./secrets/jwt_rsa_private_{{.NAME}}.pem" >> .env
        fi

        # Replace or add JWT_RSA_PUB_PATH
        if grep -q "^JWT_RSA_PUB_PATH=" .env; then
          sed -i '' "s|^JWT_RSA_PUB_PATH=.*|JWT_RSA_PUB_PATH=./secrets/jwt_rsa_public_{{.NAME}}.pem|" .env
        else
          echo "JWT_RSA_PUB_PATH=./secrets/jwt_rsa_public_{{.NAME}}.pem" >> .env
        fi

        # Replace or add JWT_KID
        if grep -q "^JWT_KID=" .env; then
          sed -i '' "s|^JWT_KID=.*|JWT_KID={{.NAME}}|" .env
        else
          echo "JWT_KID={{.NAME}}" >> .env
        fi

        echo ".env updated"
        echo ""
        echo "New entries:"
        echo "JWT_RSA_PRIV_PATH=./secrets/jwt_rsa_private_{{.NAME}}.pem"
        echo "JWT_RSA_PUB_PATH=./secrets/jwt_rsa_public_{{.NAME}}.pem"
        echo "JWT_KID={{.NAME}}"